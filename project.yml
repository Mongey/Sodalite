name: Sodalite
options:
  bundleIdPrefix: de.superuser404
  deploymentTarget:
    tvOS: "26.0"
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    # Xcode's project template sets this, XcodeGen does not, so without it the build-setting
    # default (NO) applies and Xcode keeps offering to "fix" it in the UI, which would only
    # write into the generated project and be lost on the next generate.
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: 4NY63S72W9
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DISABLE_DIAMOND_PROBLEM_DIAGNOSTIC: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    GCC_C_LANGUAGE_STANDARD: gnu17
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  configs:
    Release:
      VALIDATE_PRODUCT: YES
settingGroups:
  app:
    INFOPLIST_FILE: SupportingFiles/Info.plist
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
    PRODUCT_BUNDLE_IDENTIFIER: de.superuser404.Sodalite
    PRODUCT_NAME: Sodalite
    CODE_SIGN_ENTITLEMENTS: SupportingFiles/Sodalite.entitlements
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    revision: c6365cc3c8850bdb670654ca26dcd21f73670875
  SwiftAssRenderer:
    url: https://github.com/mihai8804858/swift-ass-renderer
    version: 1.3.1
targets:
  Sodalite-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Sodalite
        excludes:
          - "Platforms/iOS/**"
          - "Platforms/macOS/**"
      # Pure helpers the extension shares with the app (and, via @testable, with SodaliteTests).
      # Compiled here rather than added to the test target: a second JellyfinItem in the test
      # module would make every unqualified use ambiguous.
      - path: SodaliteTopShelf/Shared
      # The /Sessions shape and the playstate commands, shared with the iOS widget extension.
      - path: RemoteControl/Shared
    settings:
      groups:
        - app
      base:
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_BRAND_ASSETS_NAME: "App Icon & Top Shelf Image"
        # UIBackgroundModes lives in SupportingFiles/Info.plist for both app targets: with
        # INFOPLIST_FILE set, that file wins and an INFOPLIST_KEY_UIBackgroundModes here is
        # silently ignored (which is how remote-notification went missing for cloud sync).
      configs:
        Debug:
          ENABLE_PREVIEWS: YES
        Release:
          ENABLE_PREVIEWS: NO
          ENABLE_XOJIT_PREVIEWS: NO
          ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - package: AetherEngine
      - package: SwiftAssRenderer
      - target: SodaliteTopShelf
  Sodalite-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sodalite
        excludes:
          - "Platforms/tvOS/**"
          - "Platforms/macOS/**"
      - path: SodaliteTopShelf/Shared
      - path: RemoteControl/Shared
      # The remote-control actions and their client, shared with the widget extension.
      - path: RemoteControl/Intents
    settings:
      groups:
        - app
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
      configs:
        Debug:
          ENABLE_PREVIEWS: YES
        Release:
          ENABLE_PREVIEWS: NO
          ENABLE_XOJIT_PREVIEWS: NO
          ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - package: AetherEngine
      - package: SwiftAssRenderer
      - target: SodaliteWidgets
  Sodalite-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sodalite
        excludes:
          - "Platforms/iOS/**"
          - "Platforms/tvOS/**"
      - path: Sodalite/Platforms/iOS/AppIcon.icon
      - path: SodaliteTopShelf/Shared
      - path: RemoteControl/Shared
      - path: RemoteControl/Intents
    settings:
      groups:
        - app
      base:
        INFOPLIST_FILE: SupportingFiles/Info-macOS.plist
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/Sodalite-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          ENABLE_PREVIEWS: YES
        Release:
          ENABLE_PREVIEWS: NO
          ENABLE_XOJIT_PREVIEWS: NO
          ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - package: AetherEngine
      - package: SwiftAssRenderer
      - target: SodaliteWidgets-macOS
  # The same widget sources as SodaliteWidgets. A second target rather than one multiplatform
  # target: the Mac extension has to be sandboxed, so it signs with entitlements of its own.
  SodaliteWidgets-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: SodaliteWidgets
      - path: RemoteControl/Shared
      - path: RemoteControl/Intents
      - path: SodaliteTopShelf/Shared
    settings:
      base:
        INFOPLIST_FILE: SupportingFiles/SodaliteWidgets-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.superuser404.Sodalite.Widgets
        PRODUCT_NAME: SodaliteWidgets
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/SodaliteWidgets-macOS.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        # Hides this copy of the remote-control actions from Shortcuts; the app's copy is listed.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SODALITE_EXTENSION
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  SodaliteWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SodaliteWidgets
      - path: RemoteControl/Shared
      - path: RemoteControl/Intents
      # SharedSession and what it logs through, the same reader the Top Shelf uses.
      - path: SodaliteTopShelf/Shared
    settings:
      base:
        INFOPLIST_FILE: SupportingFiles/SodaliteWidgets-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.superuser404.Sodalite.Widgets
        PRODUCT_NAME: SodaliteWidgets
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/SodaliteWidgets.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        # Hides this copy of the remote-control actions from Shortcuts; the app's copy is listed.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SODALITE_EXTENSION
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  SodaliteTopShelf:
    type: com.apple.product-type.tv-app-extension
    platform: tvOS
    sources:
      - path: SodaliteTopShelf
    settings:
      base:
        INFOPLIST_FILE: SupportingFiles/SodaliteTopShelf-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_OUTPUT_FORMAT: binary
        PRODUCT_BUNDLE_IDENTIFIER: de.superuser404.Sodalite.TopShelf
        PRODUCT_NAME: SodaliteTopShelf
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/SodaliteTopShelf.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        LM_SKIP_METADATA_EXTRACTION: YES
        OTHER_LDFLAGS: -e _NSExtensionMain
        TARGETED_DEVICE_FAMILY: "3"
  SodaliteTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: SodaliteTests
    settings:
      base:
        PRODUCT_NAME: SodaliteTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sodalite.app/Sodalite
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: Sodalite-tvOS
schemes:
  Sodalite-tvOS:
    build:
      targets:
        Sodalite-tvOS: all
    test:
      targets:
        - SodaliteTests
  Sodalite-iOS:
    build:
      targets:
        Sodalite-iOS: all
  Sodalite-macOS:
    build:
      targets:
        Sodalite-macOS: all
